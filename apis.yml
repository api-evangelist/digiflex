name: Digiflex
description: 'Digiflex (listed by Battery Ventures as "Digiflex, Ltd.") was an Israeli
  manufacturer of inkjet-based computer-to-plate and digital printing systems, best
  known for the Flexojet line of flexographic plate-making printers. It was a hardware
  company: the product was a physical printing press, not software, so it never had a
  developer program, a public API, or any machine-readable contract to publish. PV Nano
  Cell signed a $10M all-stock letter of intent in March 2017 and closed the acquisition
  on 3 December 2017, folding Digiflex in as a wholly-owned subsidiary to carry the
  Flexojet systems into printed electronics; Battery Ventures now carries the name on
  its list-of-all-companies page as an exited investment. The brand has since been fully
  absorbed — the acquirer''s current site (pvnanocell.com, HTTP 200) makes no mention of
  DigiFlex, and digiflex.com, while still registered through Dynadot to an April 2027
  expiry, has no working nameservers and returns SERVFAIL with no A record. The live
  domains sharing the name are unrelated third parties: digiflex.io is a West Midlands
  web-design agency, digiflex.co.uk is a separate UK business, and digiflex.ai sits
  behind a Cloudflare bot challenge with no verifiable link to the Battery investment.
  No developer portal, documentation, OpenAPI, SDK, package-registry presence, or any
  other API artifact exists for this company. This profile is retained as an honest
  record of an acquired and absorbed portfolio lead with no API surface rather than
  being enriched with speculative attribution.'
